// Top-level build file where you can add configuration options common to all sub-projects/modules.

// To deploy the library to bintray and jcenter, edit the build.gradle file in the child folder
// and then, from this folder execute:
// ./gradlew bintrayUpload

buildscript {
    repositories {
        jcenter()
        google()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.4'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        jcenter()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    // SDK And Tools
    minSdkVersion = 23
    targetSdkVersion = 33
    compileSdkVersion = 30 // 这个版本号必须和 supportLibraryVersion 的大版本号保持一致
    buildToolsVersion = '28.0.3' // 这个和compileSdkVersion、supportLibraryVersion都无关
    //Dependencies
    supportLibraryVersion = '28.0.3'
}